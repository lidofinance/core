# EDF / DSM v5 Hoodi release manifest.
#
# Each guardian and oracle member has the current address removed by the vote
# and the DelegationContract address added by the vote. An empty
# delegationContract makes a local Hoodi fork deploy a test contract. A filled
# address is reused as-is and skips that deployment.
#
# When approved contracts exist, replace the empty delegationContract values.
# owner, delegate, cooldown, runtimeCodeHash and deploymentTx are optional extra
# checks. Also configure the approved Factory address and runtimeCodeHash.

