# EDF / DSM v5 Hoodi release manifest
#
# The current file describes the complete source membership that must be migrated.
# DelegationFactory and DelegationContract live addresses/configuration are intentionally
# absent until operators publish the approved contracts. On a local Hoodi fork the EDF
# deploy step fills the missing contracts in isolated deployment state. A direct Hoodi
# deployment fails until address, owner, delegate and cooldown are configured together.

