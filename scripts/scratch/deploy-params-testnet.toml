# Lido Protocol Scratch Deployment Parameters
# This file contains deployment parameters for fresh scratch deployment of Lido protocol

[chainSpec]
# Ethereum consensus layer specifications - session specific values set via env vars
slotsPerEpoch = 32                    # Number of slots per epoch in Ethereum consensus
secondsPerSlot = 12                   # Duration of each slot in seconds
# genesisTime and depositContract are set via environment variables or deployment scripts

# CircuitBreaker configuration for testnet deployment
[circuitBreaker]
minPauseDuration = 300                # Minimum pause duration in seconds (5 minutes)
maxPauseDuration = 5184000            # Maximum pause duration in seconds (60 days)
minHeartbeatInterval = 300            # Minimum heartbeat interval in seconds (5 minutes)
maxHeartbeatInterval = 94608000       # Maximum heartbeat interval in seconds (3 years)
initialPauseDuration = 1814400        # Initial pause duration in seconds (21 days)
initialHeartbeatInterval = 31536000   # Initial heartbeat interval in seconds (365 days)

# Lido APM ENS configuration
[lidoApm]
ensName = "lidopm.eth"                # ENS name for Lido APM
ensRegDurationSec = 94608000          # ENS registration duration (3 years)

# DAO configuration
[dao]
aragonId = "lido-dao"                 # Aragon DAO identifier
aragonEnsLabelName = "aragonpm"       # Aragon ENS label name

# DAO initial governance settings
[dao.initialSettings]
[dao.initialSettings.voting]
minSupportRequired = "500000000000000000"     # Minimum support required (50%)
minAcceptanceQuorum = "50000000000000000"     # Minimum acceptance quorum (5%)
voteDuration = 300                            # Vote duration in seconds (5 minutes)
objectionPhaseDuration = 60                   # Objection phase duration in seconds (1 minute)

[dao.initialSettings.fee]
totalPercent = 10                     # Total fee percentage
treasuryPercent = 50                  # Treasury fee percentage
nodeOperatorsPercent = 50             # Node operators fee percentage

[dao.initialSettings.token]
name = "TEST Lido DAO Token"          # DAO token name for testnet
symbol = "TLDO"                       # DAO token symbol for testnet

# Vesting parameters for initial token distribution
[vesting]
unvestedTokensAmount = "0"            # Amount of unvested tokens
start = 0                             # Vesting start time
cliff = 0                             # Vesting cliff period
end = 0                               # Vesting end time
revokable = false                     # Whether vesting is revokable

[vesting.holders]
# Initial token holders and amounts (in wei)
"0xD2094A6172D26037bf55EFA21e8E25E615BcD569" = "760000000000000000000000" # Default LDO whale
"0x93B0ff94855A1b73899EE99967b67ceCEC7aea34" = "60000000000000000000000" # Staking Interface DAO Voter
"0xf528Cc46B720d20f9b55d536668daadA341430D1" = "60000000000000000000000" # LDO Voter 1
"0xb84126c17078eaB4fd6371c332db02CE191Ebeb8" = "60000000000000000000000" # LDO Voter 2
"lido-aragon-agent-placeholder" = "60000000000000000000000"

# Burner configuration
[burner]
isMigrationAllowed = false            # Migration disabled for scratch deployment (vs true for upgrade)
totalCoverSharesBurnt = "0"           # Initial cover shares burnt
totalNonCoverSharesBurnt = "0"        # Initial non-cover shares burnt

# Hash consensus for accounting oracle
[hashConsensusForAccountingOracle]
fastLaneLengthSlots = 10              # Fast lane length in slots
epochsPerFrame = 12                   # Epochs per consensus frame

# Vault hub configuration for managing staking vaults
[vaultHub]
maxRelativeShareLimitBP = 1000        # Maximum relative share limit in basis points (30%)

# Lazy oracle configuration for delayed reward calculations
[lazyOracle]
quarantinePeriod = 259200                      # Quarantine period in seconds (3 days)
maxRewardRatioBP = 350                         # Maximum reward ratio in basis points (3.5%)
maxLidoFeeRatePerSecond = "180000000000000000" # Maximum Lido fee rate per second, in wei (0.18 ETH)

# Accounting oracle configuration
[accountingOracle]
consensusVersion = 6                  # Consensus version

# Hash consensus for validators exit bus oracle
[hashConsensusForValidatorsExitBusOracle]
fastLaneLengthSlots = 10              # Fast lane length in slots
epochsPerFrame = 4                    # Epochs per consensus frame

# Validators exit bus oracle configuration
[validatorsExitBusOracle]
maxValidatorsPerReport = 600         # Maximum validators per request
maxExitBalanceEth = 358400
balancePerFrameEth = 32
frameDurationInSec = 48               # Frame duration in seconds
consensusVersion = 5                  # Consensus version

# Deposit security module configuration
[depositSecurityModule]
maxOperatorsPerUnvetting = 200          # Maximum operators per unveiling
pauseIntentValidityPeriodBlocks = 6646  # Pause intent validity period in blocks
# usePredefinedAddressInstead = ""      # Use predefined address instead (empty for auto-deploy)

# Oracle report sanity checker configuration
[oracleReportSanityChecker]
exitedEthAmountPerDayLimit = 57600                     # Exited ETH amount per day limit
appearedEthAmountPerDayLimit = 57600                   # Appeared ETH amount per day limit
annualBalanceIncreaseBPLimit = 1000                    # Annual balance increase limit (BP)
simulatedShareRateDeviationBPLimit = 250               # Simulated share rate deviation limit (BP)
maxBalanceExitRequestedPerReportInEth = 19200          # Maximum exit ETH per report (600*32)
maxEffectiveBalanceWeightWCType01 = 32                 # maxEB equivalent weight for WC type 1
maxEffectiveBalanceWeightWCType02 = 2048               # maxEB equivalent weight for WC type 2
maxItemsPerExtraDataTransaction = 8                    # Maximum items per extra data transaction
maxNodeOperatorsPerExtraDataItem = 24                  # Maximum node operators per extra data item
requestTimestampMargin = 128                           # Request timestamp margin
maxPositiveTokenRebase = 5000000                       # Maximum positive token rebase
maxCLBalanceDecreaseBP = 360                           # Max CL balance decrease over sliding window (BP, 360 = 3.6%)
clBalanceOraclesErrorUpperBPLimit = 50                 # CL balance oracles error upper limit (BP)
consolidationEthAmountPerDayLimit = 93375              # Consolidation ETH amount per day limit
exitedValidatorEthAmountLimit = 32                     # Exited validator ETH amount limit in ETH units
externalPendingBalanceCapEth = 300                     # Extra external pending balance cap for bounded side deposits / top-ups

# Oracle daemon configuration
[oracleDaemonConfig]
NORMALIZED_CL_REWARD_PER_EPOCH = 64                    # Normalized CL reward per epoch
NORMALIZED_CL_REWARD_MISTAKE_RATE_BP = 1000            # Normalized CL reward mistake rate (BP)
REBASE_CHECK_NEAREST_EPOCH_DISTANCE = 1               # Rebase check nearest epoch distance
REBASE_CHECK_DISTANT_EPOCH_DISTANCE = 23              # Rebase check distant epoch distance
VALIDATOR_DELAYED_TIMEOUT_IN_SLOTS = 7200             # Validator delayed timeout in slots
VALIDATOR_DELINQUENT_TIMEOUT_IN_SLOTS = 28800         # Validator delinquent timeout in slots
NODE_OPERATOR_NETWORK_PENETRATION_THRESHOLD_BP = 100  # Node operator network penetration threshold (BP)
PREDICTION_DURATION_IN_SLOTS = 50400                  # Prediction duration in slots
FINALIZATION_MAX_NEGATIVE_REBASE_EPOCH_SHIFT = 1350   # Finalization max negative rebase epoch shift
EXIT_EVENTS_LOOKBACK_WINDOW_IN_SLOTS = 7200           # Lookback window for exit events in slots (1 day)

# Node operators registry configuration
[nodeOperatorsRegistry]
stakingModuleName = "curated-onchain-v1" # Staking module name
stakingModuleTypeId = "curated-onchain-v1" # Staking module type ID
stuckPenaltyDelay = 172800            # Stuck penalty delay in seconds (2 days)

# Simple DVT configuration
[simpleDvt]
stakingModuleName = "SimpleDVT"       # Staking module name
stakingModuleTypeId = "curated-onchain-v1" # Staking module type ID
stuckPenaltyDelay = 432000            # Stuck penalty delay in seconds (5 days)

# Withdrawal queue ERC721 configuration
[withdrawalQueueERC721]
name = "Lido: stETH Withdrawal NFT"   # NFT collection name
symbol = "unstETH"                    # NFT collection symbol
# baseUri is set to null for testnet deployment

# Validator exit delay verifier configuration for managing validator exits
[validatorExitDelayVerifier]
# Generalized indices for validator state verification in Ethereum consensus
gIFirstValidatorPrev = "0x0000000000000000000000000000000000000000000000000096000000000028"
gIFirstValidatorCurr = "0x0000000000000000000000000000000000000000000000000096000000000028"
gIFirstHistoricalSummaryPrev = "0x000000000000000000000000000000000000000000000000000000b600000018"
gIFirstHistoricalSummaryCurr = "0x000000000000000000000000000000000000000000000000000000b600000018"
gIFirstBlockRootInSummaryPrev = "0x000000000000000000000000000000000000000000000000000000000040000d"
gIFirstBlockRootInSummaryCurr = "0x000000000000000000000000000000000000000000000000000000000040000d"
# Additional deployment parameters for ValidatorExitDelayVerifier
firstSupportedSlot = 11649024              # First supported slot for validator state verification
pivotSlot = 11649024                       # Pivot slot for state verification
capellaSlot = 6209536                      # Capella upgrade slot
slotsPerHistoricalRoot = 8192              # Number of slots per historical root
shardCommitteePeriodInSeconds = 98304      # Shard committee period in seconds (2^8 * 32 * 12)

# Triggerable withdrawals gateway for managing validator exit requests
[triggerableWithdrawalsGateway]
maxExitRequestsLimit = 250          # Maximum number of exit requests that can be processed
exitsPerFrame = 1                     # Number of exits processed per frame
frameDurationInSec = 240               # Duration of each processing frame in seconds

[consolidationGateway]
maxConsolidationRequestsLimit = 2900  # Maximum number of consolidations requests that can be processed
consolidationsPerFrame = 1            # Number of consolidations processed per frame
frameDurationInSec = 36               # Duration of each processing frame in seconds
gIFirstValidatorPrev = "0x0000000000000000000000000000000000000000000000000096000000000028"  # Generalized index for first validator (before fork)
gIFirstValidatorCurr = "0x0000000000000000000000000000000000000000000000000096000000000028"  # Generalized index for first validator (after fork)
pivotSlot = 0                         # Pivot slot for fork-aware gIndex selection

[consolidationBus]
initialBatchSize = 350                # Max number of requests in a batch
initialMaxGroupsInBatch = 10          # Max source groups in a batch
initialExecutionDelay = 0             # Delay before pending batch execution

[consolidationMigrator]
sourceModuleId = 1                    # Source staking module ID (NOR)
targetModuleId = 4                    # Target staking module ID: CMv2 is plugged fourth (after NOR, SimpleDVT, CSM) on a full scratch deploy.
                                      # The 0140-plug-staking-modules step asserts the actually assigned CMv2 ID matches this value.


# Predeposit guarantee configuration for validator deposit guarantees
[predepositGuarantee]
gIndex = "0x0000000000000000000000000000000000000000000000000096000000000028"  # Generalized index for state verification
gIndexAfterChange = "0x0000000000000000000000000000000000000000000000000096000000000028"
changeSlot = 0                        # Slot number when the change takes effect

# Operator grid configuration for managing staking operators
[operatorGrid]
# Default tier parameters for operator classification and fee structure
[operatorGrid.defaultTierParams]
shareLimitInEther = "0"             # Share limit per tier in ETH
reserveRatioBP = 5000                 # Reserve ratio in basis points (20%)
forcedRebalanceThresholdBP = 4975     # Threshold for forced rebalancing in basis points (18%)
infraFeeBP = 100                      # Infrastructure fee in basis points (5%)
liquidityFeeBP = 650                  # Liquidity provision fee in basis points (4%)
reservationFeeBP = 0                # Reservation fee in basis points (1%)

# Optional protocol activation (opt-in via PROTOCOL_ACTIVATION_ENABLED=1).
# When enabled, step 0155 calls Lido.resume() and sets the staking rate limit to
# these values (wei). Defaults match lib/protocol/provision.ts ensureStakeLimit
# (150000 ETH max / 20 ETH per block). maxStakeLimit must be < 2^95 and greater
# than the per-block increase; set maxStakeLimit = "0" to resume without a limit.
[protocolActivation]
maxStakeLimit = "150000000000000000000000"           # 150000 ETH
stakeLimitIncreasePerBlock = "20000000000000000000"  # 20 ETH per block

# Dual Governance configuration for the scratch deploy.
#
# Source of the numeric values and dev addresses below:
#   foundry/lib/dual-governance/deploy-config/deploy-config-scratch.toml
# (the DG submodule's own scratch config — short timings + anvil dev keys,
# suitable for local-fork integration tests). Keys here are camelCase to match
# the rest of this file; the DG submodule's file uses snake_case.
#
# The inline `# (mainnet: …)` annotations cross-reference the production
# values in the sibling file:
#   foundry/lib/dual-governance/deploy-config/deploy-config-mainnet.toml
#
# Override per network when running against Sepolia/Hoodi/etc. The signalling
# tokens (stETH/wstETH/withdrawalQueue), the sealable withdrawal blockers, the
# admin proposer, and the proposals canceller are filled in by the config
# generator from the scratch deployment state — they are not known until the
# protocol is deployed. All other knobs come from this section.
[dualGovernance]
# Tiebreaker activation timeout: time DG must spend in a "locked" state before
# the tiebreaker committee can schedule proposals.
tiebreakerActivationTimeout = 900     # 15 minutes (mainnet: 1 year)

# Reseal committee — Gnosis Multisig on mainnet. Dev address for scratch.
resealCommittee = "0x70997970C51812dc3A010C7d01b50e0d17dc79C8" # anvil[1]

[dualGovernance.sanityCheckParams]
maxMinAssetsLockDuration = 3600                   # 1 hour (mainnet: 48 days)
maxSealableWithdrawalBlockersCount = 255
maxTiebreakerActivationTimeout = 1800             # 30 min (mainnet: 2 years)
minTiebreakerActivationTimeout = 300              # 5 min (mainnet: 6 months)
minWithdrawalsBatchSize = 1

[dualGovernance.configProvider]
# All values use D16 fixed-point (10^16 = 1%). 100% = 100 * 10^16 = 1e18.
firstSealRageQuitSupport = "10000000000000000"      # 1%
secondSealRageQuitSupport = "100000000000000000"    # 10%
minAssetsLockDuration = 300                         # 5 min (mainnet: 5 hours)
vetoSignallingMinDuration = 300                     # 5 min (mainnet: 5 days)
vetoSignallingMinActiveDuration = 300               # 5 min (mainnet: 5 hours)
vetoSignallingMaxDuration = 1800                    # 30 min (mainnet: 45 days)
vetoSignallingDeactivationMaxDuration = 600         # 10 min (mainnet: 3 days)
vetoCooldownDuration = 600                          # 10 min (mainnet: 5 hours)
rageQuitExtensionPeriodDuration = 900               # 15 min (mainnet: 7 days)
rageQuitEthWithdrawalsMinDelay = 300                # 5 min (mainnet: 60 days)
rageQuitEthWithdrawalsMaxDelay = 1800               # 30 min (mainnet: 180 days)
rageQuitEthWithdrawalsDelayGrowth = 600             # 10 min (mainnet: 15 days)

[dualGovernance.timelock]
afterSubmitDelay = 900                              # 15 min (mainnet: 3 days)
afterScheduleDelay = 900                            # 15 min (mainnet: 1 day)

[dualGovernance.timelock.sanityCheckParams]
minExecutionDelay = 600                             # 10 min (mainnet: 3 days)
maxAfterSubmitDelay = 1800                          # 30 min (mainnet: 30 days)
maxAfterScheduleDelay = 1800                        # 30 min (mainnet: 10 days)
maxEmergencyModeDuration = 86400                    # 1 day (mainnet: 1 year)
maxEmergencyProtectionDuration = 31536000           # 1 year (mainnet: 3 years)

[dualGovernance.timelock.emergencyProtection]
emergencyModeDuration = 3600                        # 1 hour (mainnet: 1 month)
# emergencyProtectionEndDate is rendered as deployment timestamp + this offset.
emergencyProtectionEndOffset = 31536000             # 1 year from deploy
# Dev addresses for scratch — replace with real multisigs per network.
emergencyGovernanceProposer = "0x70997970C51812dc3A010C7d01b50e0d17dc79C8" # anvil[1]
emergencyActivationCommittee = "0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC" # anvil[2]
emergencyExecutionCommittee = "0x90F79bf6EB2c4f870365E785982E1f101E93b906"  # anvil[3]

[dualGovernance.tiebreaker]
quorum = 2
executionDelay = 900                                # 15 min (mainnet: 1 month)

[[dualGovernance.tiebreaker.committees]]
quorum = 1
members = ["0x15d34AAf54267DB7D7c367839AAf71A00a2C6A65"] # anvil[4]

[[dualGovernance.tiebreaker.committees]]
quorum = 1
members = ["0x9965507D1a55bcC2695C58ba16FB37d819B0A4dc"] # anvil[5]

[[dualGovernance.tiebreaker.committees]]
quorum = 1
members = ["0x976EA74026E726554dB657fA54763abd0C3a0aa9"] # anvil[6]

