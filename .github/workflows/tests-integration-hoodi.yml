name: Integration Tests

on: [push]

jobs:
  test_hardhat_integration_fork:
    name: Hardhat / Hoodi
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max_old_space_size=10240
      SKIP_CONTRACT_SIZE: true
      SKIP_INTERFACES_CHECK: true

    services:
      hardhat-node:
        image: ghcr.io/lidofinance/hardhat-node:3.15.0-hoodi
        env:
          ETH_RPC_URL: ${{ secrets.HOODI_RPC_URL }}
        ports:
          - 8565:8545

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Common setup
        uses: ./.github/workflows/setup

      - name: Run integration tests
        run: yarn test:integration
        env:
          NETWORK: "hoodi"
          # the "local" network reads LOCAL_RPC_URL; derive_rpc_url derives RPC_URL from it
          LOCAL_RPC_URL: "http://localhost:8565"
          RUN_NETWORK: "local"
