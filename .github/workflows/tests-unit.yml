name: Unit Tests

on: [push]

jobs:
  test_hardhat_unit:
    name: Hardhat
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Common setup
        uses: ./.github/workflows/setup

      - name: Run unit tests
        run: NODE_OPTIONS="--max-old-space-size=10240" yarn test

  test_solidity_fuzzing:
    name: Solidity / Fuzzing & Invariants
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Common setup
        uses: ./.github/workflows/setup

      - name: Run fuzzing and invariant tests
        run: yarn hardhat test solidity
