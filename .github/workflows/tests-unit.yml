name: Unit Tests

on: [push, workflow_dispatch]

jobs:
  test_hardhat_unit:
    name: Hardhat
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Common setup
        uses: ./.github/workflows/setup

      - name: Run unit tests
        run: NODE_OPTIONS="--max-old-space-size=10240" yarn test

  test_solidity_fuzzing:
    name: Solidity / Fuzzing & Invariants
    if: github.ref_name != 'develop' && github.ref_name != 'master'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Common setup
        uses: ./.github/workflows/setup

      - name: Run fuzzing and invariant tests
        run: yarn hardhat test solidity -vvv

  test_solidity_fuzzing_deep:
    name: Solidity / Fuzzing & Invariants (deep)
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'develop' || github.ref_name == 'master'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Common setup
        uses: ./.github/workflows/setup

      - name: Use global invariant depth
        run: |
          find test -name '*.t.sol' -print0 | xargs -0 sed -i '/forge-config: default\.invariant\.depth/d'
          if git diff --quiet -- test; then
            echo "No inline invariant depth directives found"
            exit 1
          fi

      - name: Run fuzzing and invariant tests (deep profile, 10k runs)
        run: FUZZ_PROFILE=deep yarn hardhat test solidity
