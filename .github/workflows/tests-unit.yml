name: Unit Tests

on: [push, workflow_dispatch]

jobs:
  test_hardhat_unit:
    name: Hardhat
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Common setup
        uses: ./.github/workflows/setup

      - name: Run unit tests
        run: NODE_OPTIONS="--max-old-space-size=10240" yarn test

  test_solidity_fuzzing:
    name: Solidity / Fuzzing & Invariants
    if: github.ref_name != 'develop' && github.ref_name != 'master'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Common setup
        uses: ./.github/workflows/setup

      - name: Run fuzzing and invariant tests
        run: yarn hardhat test solidity -vvv

  test_solidity_fuzzing_deep_files:
    name: Solidity / Deep test files
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'develop' || github.ref_name == 'master'
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.list.outputs.files }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: List test files with test or invariant functions
        id: list
        run: |
          files=$(grep -lE 'function (test|invariant)' $(find test -name '*.t.sol') | sort | jq -Rsc 'split("\n") | map(select(. != ""))')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "$files"

  test_solidity_fuzzing_deep:
    name: Solidity / Fuzzing & Invariants (deep)
    needs: test_solidity_fuzzing_deep_files
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.test_solidity_fuzzing_deep_files.outputs.files) }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Common setup
        uses: ./.github/workflows/setup

      - name: Use global invariant depth
        run: |
          find test -name '*.t.sol' -print0 | xargs -0 sed -i '/forge-config: default\.invariant\.depth/d'
          if git diff --quiet -- test; then
            echo "No inline invariant depth directives found"
            exit 1
          fi

      # Build everything first: with a file argument `test solidity` compiles only that
      # file's imports, and suites deploying contracts via vm.getCode miss their artifacts.
      - name: Build all contracts and tests
        run: yarn hardhat build

      - name: Run fuzzing and invariant tests (deep profile, 10k runs)
        run: FUZZ_PROFILE=deep yarn hardhat test solidity --no-compile ${{ matrix.file }}
