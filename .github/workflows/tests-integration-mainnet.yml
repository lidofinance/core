name: Integration Tests

on: [push]

jobs:
  test_hardhat_integration_fork:
    name: Hardhat / Mainnet
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max_old_space_size=10240
      SKIP_GAS_REPORT: true
      SKIP_CONTRACT_SIZE: true
      SKIP_INTERFACES_CHECK: true

    services:
      hardhat-node:
        image: ghcr.io/lidofinance/hardhat-node:2.28.0
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
        ports:
          - 8545:8545

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Common setup
        uses: ./.github/workflows/setup

      # https://github.com/foundry-rs/foundry-toolchain
      - name: Install foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.7.1

      - name: Install just
        run: cargo install just

      - name: Run integration tests
        # Use the following command if there are upgrade steps
        # run: yarn test:integration:upgrade
        run: yarn test:integration
        env:
          NETWORK: "mainnet"
          RUN_NETWORK: "local"
