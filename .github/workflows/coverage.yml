name: Coverage

on:
  pull_request:
  push:
    branches: [master]

jobs:
  coverage:
    name: Hardhat / Unit Tests
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Common setup
        uses: ./.github/workflows/setup

      - name: Use coverage fuzz settings
        run: |
          find test -name '*.t.sol' -print0 | xargs -0 sed -i -E '/forge-config: default\.(fuzz\.runs|invariant\.(runs|depth))/d'
          git diff --quiet -- test && { echo "No inline fuzz or invariant iteration directives found"; exit 1; }

      - name: Collect coverage
        run: NODE_OPTIONS="--max-old-space-size=10240" yarn test:coverage
        timeout-minutes: 60

      # HH3's native coverage emits lcov; the publish step consumes Cobertura XML.
      - name: Convert lcov to Cobertura
        run: pipx run lcov_cobertura==2.1.1 coverage/lcov.info --output coverage/cobertura-coverage.xml --base-dir .

      - name: Produce the coverage report
        uses: lidofinance/coverage-action@b036d2354d1aeffd162da773e5be853283d28888
        with:
          path: ./coverage/cobertura-coverage.xml
          publish: true
          threshold: 95
          diff: true
          diff-branch: master
          diff-storage: _core_coverage_reports
          coverage-summary-title: "Hardhat Unit Tests Coverage Summary"
          togglable-report: true
