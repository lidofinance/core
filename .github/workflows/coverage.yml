name: Coverage

on:
  pull_request:
  push:
    branches: [master]

jobs:
  coverage:
    name: Hardhat / Unit Tests
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Common setup
        uses: ./.github/workflows/setup

      - name: Collect coverage
        run: NODE_OPTIONS="--max-old-space-size=10240" yarn test:coverage
        timeout-minutes: 30

      - name: Produce the coverage report
        uses: lidofinance/coverage-action@b036d2354d1aeffd162da773e5be853283d28888
        with:
          path: ./coverage/cobertura-coverage.xml
          publish: true
          threshold: 95
          diff: true
          diff-branch: master
          diff-storage: _core_coverage_reports
          coverage-summary-title: "Hardhat Unit Tests Coverage Summary"
          togglable-report: true
