name: Verify State

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "develop"
  pull_request:
    paths:
      - ".github/workflows/verify-state.yml"
  schedule:
    - cron: "0 0 * * *" # runs every day at midnight UTC

jobs:
  run_state_mate_hoodi:
    name: Hoodi State
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      STATE_MATE_BRANCH: "main"
      ETH_HOODI_RPC_URL: "${{ secrets.HOODI_RPC_URL }}"
      ETHERSCAN_TOKEN: "${{ secrets.ETHERSCAN_TOKEN }}"

    steps:
      - name: Checkout state-mate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lidofinance/state-mate
          ref: ${{ env.STATE_MATE_BRANCH }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run state-mate (Hoodi Testnet)
        run: yarn start configs/lido/testnet/lido.yaml

      - name: Run state-mate (Hoodi Easy Track)
        run: yarn start configs/lido/testnet/lido-et.yaml

  run_state_mate_mainnet:
    name: Mainnet State
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      STATE_MATE_BRANCH: "main"
      ETH_RPC_URL: "${{ secrets.ETH_RPC_URL }}"
      ETHERSCAN_TOKEN: "${{ secrets.ETHERSCAN_TOKEN }}"

    steps:
      - name: Checkout state-mate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lidofinance/state-mate
          ref: ${{ env.STATE_MATE_BRANCH }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run state-mate (Mainnet)
        run: yarn start configs/lido/mainnet/lido.yaml

      - name: Run state-mate (Mainnet Easy Track)
        run: yarn start configs/lido/mainnet/lido-et.yaml
